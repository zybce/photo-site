<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>网站维护中 - 观球盛宴</title>
<meta name="description" content="网站正在维护中，请稍后再来。">
<meta name="theme-color" content="#0b0d12">
<link rel="icon" href="data:,">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 24px;
    color: #e8ecf4;
    background:
      radial-gradient(circle at 50% 20%, rgba(255, 107, 53, .09), transparent 38%),
      #0b0d12;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .card {
    width: min(100%, 520px);
    padding: 48px 40px 40px;
    text-align: center;
    border: 1px solid rgba(255, 255, 255, .09);
    border-radius: 20px;
    background: rgba(18, 21, 28, .94);
    box-shadow: 0 24px 70px rgba(0, 0, 0, .35);
  }
  .brand {
    margin: 0 0 30px;
    color: #f2f5fa;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: .12em;
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 18px;
    padding: 7px 12px;
    color: #ff9a70;
    background: rgba(255, 107, 53, .10);
    border: 1px solid rgba(255, 107, 53, .20);
    border-radius: 999px;
    font-size: 12px;
  }
  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #ff6b35;
    box-shadow: 0 0 0 4px rgba(255, 107, 53, .12);
  }
  h1 {
    margin: 0 0 18px;
    font-size: clamp(28px, 7vw, 36px);
    line-height: 1.25;
    letter-spacing: .04em;
  }
  .message {
    margin: 0;
    color: #aab2c0;
    font-size: 15px;
    line-height: 1.9;
  }
  .divider {
    width: 48px;
    height: 2px;
    margin: 30px auto 20px;
    background: linear-gradient(90deg, #ff6b35, #ff8c42);
    border-radius: 2px;
  }
  .note { margin: 0; color: #737d8d; font-size: 13px; }
  @media (max-width: 480px) {
    body { padding: 18px; }
    .card { padding: 38px 24px 32px; border-radius: 16px; }
    .brand { margin-bottom: 26px; }
  }
</style>
</head>
<body>
<main class="card">
  <p class="brand">观球盛宴</p>
  <div class="status"><span class="dot" aria-hidden="true"></span>站点维护通知</div>
  <h1>网站维护中</h1>
  <p class="message">正在整理作品与下载链接，暂时关闭访问。<br>请稍后再来，感谢你的耐心等待。</p>
  <div class="divider" aria-hidden="true"></div>
  <p class="note">维护结束后恢复访问</p>
</main>
</body>
</html>
